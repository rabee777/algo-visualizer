<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algo Visualizer</title>
<style>
:root{--bg:#070816;--panel:#10132e;--ink:#e6f4ff;--mute:#8a93b8;--bar:#7a6bff;--hot:#ff5c8a;--ok:#5ee7a0;--a:#5ee7ff;--line:rgba(140,160,255,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f2f5ff;--panel:#e4e9ff;--ink:#0d1030;--mute:#4b5380;--bar:#5a3df0;--hot:#d4245a;--ok:#0b9a5a;--a:#0089b3;--line:rgba(60,70,160,.25);color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:20px;max-width:900px;margin:auto}
h1{font-size:1.6rem;margin-bottom:4px}
p{color:var(--mute);margin-bottom:16px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.go{background:var(--a);color:#06101e;border-color:var(--a);font-weight:600}
label{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
input[type=range]{accent-color:var(--a);width:100px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#bars{display:flex;align-items:flex-end;gap:2px;height:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
#bars i{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-width:2px}
#bars i.h{background:var(--hot)}#bars i.d{background:var(--ok)}
.info{display:flex;gap:20px;margin-top:12px;color:var(--mute);font-size:14px}
.info b{color:var(--ink)}
#cx{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
</style>
</head>
<body>
<h1>Algo Visualizer</h1>
<p>Watch how sorting algorithms work, one comparison at a time.</p>
<div class="ctl">
<select id="alg" aria-label="Algorithm"><option value="bubble">Bubble sort</option><option value="selection">Selection sort</option><option value="insertion">Insertion sort</option><option value="merge">Merge sort</option><option value="quick">Quick sort</option></select>
<label>Size <input id="n" type="range" min="10" max="100" value="40"></label>
<label>Speed <input id="spd" type="range" min="1" max="100" value="60"></label>
<button id="shuf">Shuffle</button>
<button id="go" class="go">Start</button>
</div>
<div id="bars" role="img" aria-label="Bar chart of the array being sorted"></div>
<div class="info"><span>Comparisons: <b id="cmp">0</b></span><span>Time: <b id="tm">0.0</b>s</span></div>
<div id="cx"></div>
<script>
const $=id=>document.getElementById(id);
const INFO={bubble:["Bubble sort","Repeatedly swaps neighbours that are out of order.","Time O(n²) · Space O(1)"],selection:["Selection sort","Finds the smallest remaining item and moves it forward.","Time O(n²) · Space O(1)"],insertion:["Insertion sort","Grows a sorted section by inserting each new item in place.","Time O(n²) · Space O(1)"],merge:["Merge sort","Splits the array, sorts halves, then merges them.","Time O(n log n) · Space O(n)"],quick:["Quick sort","Partitions around a pivot, then sorts each side.","Time O(n log n) average · Space O(log n)"]};
let a=[],running=false,stop=false,count=0;
function make(){a=Array.from({length:+$("n").value},()=>5+Math.floor(Math.random()*95));count=0;paint()}
function paint(h=[],all=false){const b=$("bars");if(b.children.length!==a.length){b.innerHTML=a.map(()=>"<i></i>").join("")}
const hs=new Set(h);[...b.children].forEach((e,i)=>{e.style.height=a[i]+"%";e.className=all?"d":hs.has(i)?"h":""});$("cmp").textContent=count}
function*bubble(){for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++){count++;yield[j,j+1];if(a[j]>a[j+1])[a[j],a[j+1]]=[a[j+1],a[j]]}}
function*selection(){for(let i=0;i<a.length;i++){let m=i;for(let j=i+1;j<a.length;j++){count++;yield[m,j];if(a[j]<a[m])m=j}[a[i],a[m]]=[a[m],a[i]];yield[i,m]}}
function*insertion(){for(let i=1;i<a.length;i++){let j=i;while(j>0){count++;yield[j,j-1];if(a[j]<a[j-1]){[a[j],a[j-1]]=[a[j-1],a[j]];j--}else break}}}
function*merge(l=0,r=a.length-1){if(l>=r)return;const m=(l+r)>>1;yield*merge(l,m);yield*merge(m+1,r);const L=a.slice(l,m+1),R=a.slice(m+1,r+1);let i=0,j=0,k=l;
while(i<L.length&&j<R.length){count++;a[k]=L[i]<=R[j]?L[i++]:R[j++];yield[k++]}while(i<L.length){a[k]=L[i++];yield[k++]}while(j<R.length){a[k]=R[j++];yield[k++]}}
function*quick(l=0,r=a.length-1){if(l>=r)return;const p=a[r];let i=l;for(let j=l;j<r;j++){count++;yield[j,r];if(a[j]<p){[a[i],a[j]]=[a[j],a[i]];i++}}[a[i],a[r]]=[a[r],a[i]];yield[i];yield*quick(l,i-1);yield*quick(i+1,r)}
const ALG={bubble,selection,insertion,merge,quick};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function start(){if(running){stop=true;return}
running=true;stop=false;$("go").textContent="Stop";const t0=performance.now();count=0;
for(const h of ALG[$("alg").value]()){if(stop)break;paint(h);$("tm").textContent=((performance.now()-t0)/1000).toFixed(1);await sleep(Math.max(0,(100-$("spd").value)*1.2))}
if(!stop)paint([],true);running=false;$("go").textContent="Start"}
function info(){const[i,d,c]=INFO[$("alg").value];$("cx").innerHTML=`<b>${i}</b>: ${d}<br>${c}`}
$("shuf").onclick=()=>{stop=true;setTimeout(make,50)};
$("n").oninput=()=>{stop=true;setTimeout(make,50)};
$("alg").onchange=()=>{stop=true;info();setTimeout(make,50)};
$("go").onclick=start;make();info();
</script>
</body>
</html>
